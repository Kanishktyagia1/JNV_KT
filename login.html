<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | JNV Result Manager</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-logo h1 {
            color: #2563eb;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .login-logo p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .login-submit {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-submit:hover {
            background: #1d4ed8;
        }

        .login-links {
            text-align: center;
            margin-top: 22px;
        }

        .login-links a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .login-links p {
            margin-top: 14px;
            color: #64748b;
            font-size: 14px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <h1>JNV Result Manager</h1>
                <p>Admin and Teacher Login Portal</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="teacherId">Teacher ID / Admin Email</label>
<input
    type="text"
    id="teacherId"
    placeholder="Teacher ID or Admin Email"
    required
>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
        style="padding-right: 45px;"
    >

    <button
        type="button"
        id="togglePassword"
        style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
        border:none; background:none; cursor:pointer; font-size:18px;"
    >👁️</button>
                    </div>
                </div>

                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <div class="login-links">
                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>

                <p>
                    New Main Teacher?
                    <a href="signup.html">Create Account</a>
                </p>
            </div>

        </div>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

    <script>
const loginForm = document.getElementById("loginForm");
const forgotPassword = document.getElementById("forgotPassword");

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const loginId =
        document.getElementById("teacherId").value.trim();

    const password =
        document.getElementById("password").value;

    if (!loginId || !password) {
        alert("Please enter your login ID and password.");
        return;
    }

    let email = loginId;

    // Teacher ID → internal Auth email
    if (!loginId.includes("@")) {
        email =
            loginId.toLowerCase() +
            "@jnvresultmanager.local";
    }

    // Supabase Auth
    const { data, error } =
        await db.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        console.error("Login error:", error);

        alert(
            "Login failed:\n\n" +
            error.message
        );

        return;
    }

    if (!data.user) {
        alert("Login failed.");
        return;
    }

    // =====================================
    // 1. CHECK ADMIN
    // =====================================

    const { data: school, error: schoolError } =
        await db
            .from("schools")
            .select(`
                id,
                school_name,
                school_address,
                state,
                district,
                admin_name,
                email,
                mobile,
                auth_user_id
            `)
            .eq("auth_user_id", data.user.id)
            .maybeSingle();

    if (schoolError) {

        console.error("Admin lookup error:", schoolError);

        await db.auth.signOut();

        alert(
            "Account verification failed.\n\n" +
            schoolError.message
        );

        return;
    }

    // Admin found
    if (school) {

        localStorage.setItem(
            "jnv_logged_in",
            "true"
        );

        localStorage.setItem(
            "jnv_user_role",
            "admin"
        );

        localStorage.setItem(
            "jnv_school_id",
            school.id
        );

        localStorage.setItem(
            "jnv_logged_school",
            JSON.stringify(school)
        );

        // ---------------------------------
        // Pending school signup
        // ---------------------------------

        const pendingSignup =
            localStorage.getItem(
                "pending_school_signup"
            );

        if (pendingSignup) {

            console.log(
                "Pending school information found."
            );

            /*
             * IMPORTANT:
             * Abhi school data ko directly
             * database mein insert nahi karenge.
             *
             * Secure server API next step mein
             * handle karegi.
             */
        }

        window.location.href =
            "main-dashboard.html";

        return;
    }

    // =====================================
    // 2. CHECK TEACHER
    // =====================================

    const {
        data: teacher,
        error: teacherError
    } = await db
        .from("teachers")
        .select(
            "id, school_id, teacher_name, teacher_id, assigned_subject, auth_user_id"
        )
        .eq(
            "auth_user_id",
            data.user.id
        )
        .maybeSingle();

    if (teacherError) {

        console.error(
            "Teacher lookup error:",
            teacherError
        );

        await db.auth.signOut();

        alert(
            "Teacher profile lookup failed:\n\n" +
            teacherError.message
        );

        return;
    }

    if (!teacher) {

        await db.auth.signOut();

        alert(
            "This account is not registered as an Admin or Teacher."
        );

        return;
    }

    // Teacher login
    localStorage.setItem(
        "jnv_logged_in",
        "true"
    );

    localStorage.setItem(
        "jnv_user_role",
        "teacher"
    );

    localStorage.setItem(
        "jnv_logged_teacher",
        JSON.stringify(teacher)
    );

    window.location.href =
        "teacher-dashboard.html";
});


// =====================================
// FORGOT PASSWORD
// =====================================

forgotPassword.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();

        const input =
            document
                .getElementById("teacherId")
                .value
                .trim();

        if (!input) {

            alert(
                "Enter your Admin Email or Teacher ID first."
            );

            return;
        }

        let email = input;

        if (!input.includes("@")) {

            email =
                input.toLowerCase() +
                "@jnvresultmanager.local";
        }

        const { error } =
            await db.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        "/reset-password.html"
                }
            );

        if (error) {

            console.error(
                "Password reset error:",
                error
            );

            alert(
                "Password reset failed:\n\n" +
                error.message
            );

            return;
        }

        alert(
            "Password reset link has been sent to your email."
        );
    }
);


// =====================================
// SHOW / HIDE PASSWORD
// =====================================

const togglePassword =
    document.getElementById("togglePassword");

const passwordInput =
    document.getElementById("password");

togglePassword.addEventListener(
    "click",
    function() {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";
            togglePassword.textContent = "🙈";

        } else {

            passwordInput.type = "password";
            togglePassword.textContent = "👁️";
        }
    }
);
      </script>
</body>
</html>
