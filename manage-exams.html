<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Exams</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            opacity: 0.9;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            font-size: 22px;
        }

        .create-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .create-btn:hover {
            background: #15803d;
        }

        .exam-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .exam-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }

        .exam-card h3 {
            color: #1e3a8a;
            margin-bottom: 15px;
            font-size: 19px;
        }

        .exam-info {
            line-height: 1.8;
            color: #444;
            margin-bottom: 15px;
        }

        .exam-info strong {
            color: #222;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 9px 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }

        .result-btn {
            background: #2563eb;
        }

        .result-btn:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 10px;
            color: #666;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .empty h3 {
            margin-bottom: 8px;
            color: #333;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 20px;
            }

            .container {
                width: 92%;
            }

            .exam-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📋 Manage Exams</h1>
    <p>View and manage all created examinations</p>
</header>

<div class="container">

    <div class="top-bar">
        <h2>Created Exams</h2>

        <button class="create-btn" onclick="createNewExam()">
            ➕ Create New Exam
        </button>
    </div>

    <div id="examContainer">
        <!-- Exams will appear here -->
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="manage-exams.js"></script>

</body>
</html>
