<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JNV Result Manager - Result</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#222;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.top-bar{
    background:white;
    padding:18px;

}

.school-name{

.school-address{

.info-box{

button{

.btn-primary{

.btn-success{

}

button:hover{

}

.message{

}

.table-wrapper{
    background:white;
    border-radius:12px;
    overflow:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

table{
    width:100%;

}

th,
td{

th{

}

td{

}

.student-name{

}

.marks-input{
    width:70px;

}

.marks-input:focus{

}

.pass{
    color:#15803d;

}

.fail{
    color:#dc2626;
    font-weight:bold;
}

.rank{
    font-weight:bold;
}

.summary{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
}

.summary-card{
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.summary-card h3{
    font-size:14px;
    color:#64748b;
    margin-bottom:8px;
}

.summary-card p{
    font-size:23px;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:40px;
    font-size:18px;
    color:#64748b;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:8px;
    margin:15px 0;
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .school-name{
        font-size:20px;
    }

    .controls{
        align-items:stretch;
    }

    button{
        width:100%;
    }

    .message{
        width:100%;
        margin-left:0;
    }
}

@media print{
    body{
        background:white;
        padding:0;
    }

    .controls{
        display:none;
    }

    .table-wrapper{
        box-shadow:none;
    }

    .summary-card{
        box-shadow:none;
        border:1px solid #ddd;
    }

    table{
        min-width:0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top-bar">

        <div class="school-name" id="schoolName">
            जवाहर नवोदय विद्यालय
        </div>

        <div class="school-address" id="schoolAddress">
            Result Manager
        </div>

        <div class="exam-info">

            <div class="info-box">
                परीक्षा:
                <strong id="examName">लोड हो रहा है...</strong>
            </div>

            <div class="info-box">
                कक्षा:
                <strong id="className">-</strong>
            </div>

            <div class="info-box">
                सेक्शन:
                <strong id="sectionName">-</strong>
            </div>

            <div class="info-box">
                वर्ष:
                <strong id="examYear">-</strong>
            </div>

        </div>
    </div>


    <div class="controls">

        <button
            class="btn-success"
            onclick="saveResult()">
            💾 Result Save
        </button>

        <button
            class="btn-primary"
            onclick="calculateResults()">
            🧮 Calculate
        </button>

        <button
            class="btn-secondary"
            onclick="window.print()">
            🖨️ Print
        </button>

        <button
            class="btn-primary"
            onclick="exportToExcel()">
            📊 Excel
        </button>

        <button

            onclick="goBack()">
            ← वापस
        </button>

            class="message"
            id="message">
        </div>

    </div>


    <div id="errorBox"></div>

    </div>


    <div

        id="tableContainer"
        style="display:none;">

        <table id="resultTable">

            <thead id="tableHead">
            </thead>

            <tbody id="studentTableBody">
            </tbody>

        </table>

    </div>


    <div
        class="summary"
        id="summary"
        style="display:none;">

        <div class="summary-card">
            <h3>कुल विद्यार्थी</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="summary-card">
            <h3>पास</h3>
            <p id="totalPassed">0</p>
        </div>

        <div class="summary-card">
            <h3>फेल</h3>
            <p id="totalFailed">0</p>
        </div>

        <div class="summary-card">
            <h3>पास प्रतिशत</h3>
            <p id="passPercentage">0%</p>
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://pzvnavadhgqfceaypjqb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_89GpCTlNtJKkId9HSoqEfg_BGIXkLAM";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


let exam = null;

let examId = null;

let schoolId = null;

let subjectDetails = [];

let students = [];

let resultLoaded = false;


/* ----------------------------------
   PAGE START
---------------------------------- */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        try{

            const params =
                new URLSearchParams(
                    window.location.search
                );

            examId =
                params.get("id");

            schoolId =
                localStorage.getItem(
                    "jnv_school_id"
                );

            if(!examId){

                showError(
                    "Exam ID नहीं मिला।"
                );

                return;
            }

            if(!schoolId){

                showError(
                    "School ID नहीं मिली। पहले login/signup करें।"
                );

                return;
            }

            await loadExam();

        }catch(error){

            console.error(error);

            showError(
                "Result load करते समय error आया।"
            );

        }

    }
);


/* ----------------------------------
   EXAM LOAD
---------------------------------- */

async function loadExam(){

    setLoading(
        "Exam information load हो रही है..."
    );


    const {
        data:examData,
        error:examError
    } = await db
        .from("exams")
        .select(`
            id,
            school_id,
            class_id,
            exam_name,
            exam_year,
            max_marks,
            student_count
        `)
        .eq(
            "id",
            examId
        )
        .eq(
            "school_id",
            schoolId
        )
        .single();


    if(examError){

        console.error(
            "Exam error:",
            examError
        );

        showError(
            "Exam नहीं मिला: " +
            examError.message
        );

        return;
    }


    if(!examData){

        showError(
            "Exam record नहीं मिला।"
        );

        return;
    }


    /* -----------------------------
       SCHOOL
    ----------------------------- */

    const {
        data:schoolData,
        error:schoolError
    } = await db
        .from("schools")
        .select(`
            school_name,
            school_address,
            state,
            district
        `)
        .eq(
            "id",
            schoolId
        )
        .single();


    if(schoolError){

        console.warn(
            "School data error:",
            schoolError
        );

    }


    /* -----------------------------
       CLASS
    ----------------------------- */

    const {
        data:classData,
        error:classError
    } = await db
        .from("classes")
        .select(`
            class_name,
            section
        `)
        .eq(
            "id",
            examData.class_id
        )
        .single();


    if(classError){

        console.warn(
            "Class data error:",
            classError
        );

    }


    /* -----------------------------
       SUBJECTS
    ----------------------------- */

    const {
        data:subjectData,
        error:subjectError
    } = await db
        .from("exam_subjects")
        .select(`
            id,
            subject_name,
            max_marks,
            created_at
        `)
        .eq(
            "exam_id",
            examId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(subjectError){

        console.error(
            "Subject error:",
            subjectError
        );

        showError(
            "Subjects load नहीं हुए: " +
            subjectError.message
        );

        return;
    }


    subjectDetails =
        subjectData || [];


    /* -----------------------------
       EXAM STUDENTS
    ----------------------------- */

    const {
        data:examStudents,
        error:studentError
    } = await db
        .from("exam_students")
        .select(`
            id,
            student_id,
            roll_number_snapshot,
            student_name_snapshot
        `)
        .eq(
            "exam_id",
            examId
        )
        .order(
            "roll_number_snapshot",
            {
                ascending:true
            }
        );


    if(studentError){

        console.error(
            "Student error:",
            studentError
        );

        showError(
            "Students load नहीं हुए: " +
            studentError.message
        );

        return;
    }


    students =
        (examStudents || [])
        .map(function(student){

            return {

                id:
                    student.id,

                studentId:
                    student.student_id,

                rollNumber:
                    student.roll_number_snapshot ||
                    "",

                studentName:
                    student.student_name_snapshot ||
                    ""

            };

        });


    /* -----------------------------
       FINAL EXAM OBJECT
    ----------------------------- */

    exam = {

        id:
            examData.id,

        schoolId:
            examData.school_id,

        classId:
            examData.class_id,

        schoolName:
            schoolData?.school_name ||
            "जवाहर नवोदय विद्यालय",

        schoolAddress:
            schoolData?.school_address ||
            "",

        state:
            schoolData?.state ||
            "",

        district:
            schoolData?.district ||
            "",

        examName:
            examData.exam_name ||
            "",

        examYear:
            examData.exam_year ||
            "",

        className:
            classData?.class_name ||
            "",

        section:
            classData?.section ||
            "",

        maxMarks:
            Number(
                examData.max_marks || 0
            ),

        subjects:
            subjectDetails.map(
                function(subject){
                    return subject.subject_name;
                }
            ),

        subjectDetails:
            subjectDetails,

        students:
            students

    };


    renderExamHeader();

    renderTable();

    await loadSavedResult();

    calculateResults();

    updateSummary();

}


/* ----------------------------------
   HEADER
---------------------------------- */

function renderExamHeader(){

    document.getElementById(
        "schoolName"
    ).textContent =
        exam.schoolName;


    let address =
        exam.schoolAddress;


    if(exam.district){

        if(address){
            address += " • ";
        }

        address += exam.district;

    }


    if(exam.state){

        if(address){
            address += " • ";
        }

        address += exam.state;

    }


    document.getElementById(
        "schoolAddress"
    ).textContent =
        address ||
        "JNV Result Manager";


    document.getElementById(
        "examName"
    ).textContent =
        exam.examName;


    document.getElementById(
        "className"
    ).textContent =
        exam.className;


    document.getElementById(
        "sectionName"
    ).textContent =
        exam.section;


    document.getElementById(
        "examYear"
    ).textContent =
        exam.examYear;

}


/* ----------------------------------
   TABLE
---------------------------------- */

function renderTable(){

    const tableHead =
        document.getElementById(
            "tableHead"
        );


    const tbody =
        document.getElementById(
            "studentTableBody"
        );


    tableHead.innerHTML = "";

    tbody.innerHTML = "";


    const headerRow =
        document.createElement(
            "tr"
        );


    addHeader(
        headerRow,
        "Rank"
    );


    addHeader(
        headerRow,
        "Roll No."
    );


    addHeader(
        headerRow,
        "Student Name"
    );


    subjectDetails.forEach(
        function(subject){

            addHeader(
                headerRow,
                subject.subject_name +
                " (" +
                subject.max_marks +
                ")"
            );

        }
    );


    addHeader(
        headerRow,
        "Total"
    );


    addHeader(
        headerRow,
        "%"
    );


    addHeader(
        headerRow,
        "Result"
    );


    tableHead.appendChild(
        headerRow
    );


    students.forEach(
        function(student,index){

            createStudentRow(
                student,
                index
            );

        }
    );


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "tableContainer"
    ).style.display =
        "block";


    document.getElementById(
        "summary"
    ).style.display =
        "grid";

}


/* ----------------------------------
   HEADER CELL
---------------------------------- */

function addHeader(
    row,
    text
){

    const th =
        document.createElement(
            "th"
        );

    th.textContent =
        text;

    row.appendChild(
        th
    );

}


/* ----------------------------------
   STUDENT ROW
---------------------------------- */

function createStudentRow(
    student,
    index
){

    const tbody =
        document.getElementById(
            "studentTableBody"
        );


    const row =
        document.createElement(
            "tr"
        );


    row.dataset.examStudentId =
        student.id;


    row.dataset.studentId =
        student.studentId ||
        "";


    row.dataset.index =
        index;


    const rankCell =
        document.createElement(
            "td"
        );

    rankCell.className =
        "rank";


    rankCell.textContent =
        "-";


    row.appendChild(
        rankCell
    );


    const rollCell =
        document.createElement(
            "td"
        );

    rollCell.textContent =
        student.rollNumber;


    row.appendChild(
        rollCell
    );


    const nameCell =
        document.createElement(
            "td"
        );

    nameCell.className =
        "student-name";


    nameCell.textContent =
        student.studentName;


    row.appendChild(
        nameCell
    );


    subjectDetails.forEach(
        function(subject){

            const td =
                document.createElement(
                    "td"
                );


            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "number";


            input.className =
                "marks-input";


            input.min =
                "0";


            input.max =
                subject.max_marks;


            input.step =
                "0.01";


            input.dataset.subject =
                subject.subject_name;


            input.dataset.maxMarks =
                subject.max_marks;


            input.addEventListener(
                "input",
                function(){

                    validateMarks(
                        input
                    );

                    calculateResults();

                    updateSummary();

                }
            );


            td.appendChild(
                input
            );


            row.appendChild(
                td
            );

        }
    );


    const totalCell =
        document.createElement(
            "td"
        );


    totalCell.className =
        "total";


    totalCell.textContent =
        "0";


    row.appendChild(
        totalCell
    );


    const percentageCell =
        document.createElement(
            "td"
        );


    percentageCell.className =
        "percentage";


    percentageCell.textContent =
        "0%";


    row.appendChild(
        percentageCell
    );


    const resultCell =
        document.createElement(
            "td"
        );


    resultCell.className =
        "result";


    resultCell.textContent =
        "-";


    row.appendChild(
        resultCell
    );


    tbody.appendChild(
        row
    );

}


/* ----------------------------------
   MARKS VALIDATION
---------------------------------- */

function validateMarks(
    input
){

    const max =
        Number(
            input.dataset.maxMarks ||
            0
        );


    let value =
        input.value;


    if(value === ""){
        return;
    }


    let number =
        Number(value);


    if(Number.isNaN(number)){

        input.value = "";

        return;

    }


    if(number < 0){

        input.value =
            "0";

        return;

    }


    if(number > max){

        input.value =
            max;

        return;

    }

}

/* ----------------------------------
   CALCULATE
---------------------------------- */

function calculateResults(){

    const rows =
        document.querySelectorAll(
            "#studentTableBody tr"
        );


    const calculated = [];


    rows.forEach(
        function(row){

            let total = 0;

            let maximum = 0;

            let hasMarks = false;


            const inputs =
                row.querySelectorAll(
                    ".marks-input"
                );


            inputs.forEach(
                function(input){

                    const max =
                        Number(
                            input.dataset.maxMarks ||
                            0
                        );


                    maximum += max;


                    if(
                        input.value !== ""
                    ){

                        const marks =
                            Number(
                                input.value
                            );


                        if(
                            !Number.isNaN(
                                marks
                            )
                        ){

                            total += marks;

                            hasMarks = true;

                        }

                    }

                }
            );


            let percentage = 0;


            if(maximum > 0){

                percentage =
                    (
                        total /
                        maximum
                    ) *
                    100;

            }


            const result =
                getStudentResult(
                    row,
                    hasMarks
                );


            const totalCell =
                row.querySelector(
                    ".total"
                );


            const percentageCell =
                row.querySelector(
                    ".percentage"
                );


            const resultCell =
                row.querySelector(
                    ".result"
                );


            totalCell.textContent =
                formatNumber(
                    total
                );


            percentageCell.textContent =
                percentage.toFixed(2) +
                "%";


            resultCell.textContent =
                result;


            resultCell.classList.remove(
                "pass",
                "fail"
            );


            if(result === "PASS"){

                resultCell.classList.add(
                    "pass"
                );

            }


            if(result === "FAIL"){

                resultCell.classList.add(
                    "fail"
                );

            }


            calculated.push({

                row:
                    row,

                total:
                    total,

                percentage:
                    percentage,

                result:
                    result

            });

        }
    );


    calculated.sort(
        function(a,b){

            return (
                b.percentage -
                a.percentage
            );

        }
    );


    let currentRank = 0;

    let previousPercentage =
        null;


    calculated.forEach(
        function(item,index){

            if(
                previousPercentage ===
                null ||
                item.percentage !==
                previousPercentage
            ){

                currentRank =
                    index + 1;

            }


            item.row
                .querySelector(
                    ".rank"
                )
                .textContent =
                item.percentage > 0
                    ? currentRank
                    : "-";


            previousPercentage =
                item.percentage;

        }
    );


    return calculated;

}


/* ----------------------------------
   RESULT STATUS
---------------------------------- */

function getStudentResult(
    row,
    hasMarks
){

    if(!hasMarks){

        return "-";

    }


    const inputs =
        row.querySelectorAll(
            ".marks-input"
        );


    if(inputs.length === 0){

        return "-";

    }


    let allFilled = true;

    let failed = false;


    inputs.forEach(
        function(input){

            if(
                input.value === ""
            ){

                allFilled = false;

                return;

            }


            const marks =
                Number(
                    input.value
                );


            const max =
                Number(
                    input.dataset.maxMarks ||
                    0
                );


            /*
             * फिलहाल 33% passing rule.
             * बाद में इसे exam settings
             * से dynamic किया जा सकता है.
             */

            if(
                max > 0 &&
                marks <
                max * 0.33
            ){

                failed = true;

            }

        }
    );


    if(!allFilled){

        return "INCOMPLETE";

    }


    if(failed){

        return "FAIL";

    }


    return "PASS";

}


/* ----------------------------------
   FORMAT NUMBER
---------------------------------- */

function formatNumber(
    number
){

    if(
        Number.isInteger(
            number
        )
    ){

        return String(
            number
        );

    }


    return Number(
        number.toFixed(2)
    ).toString();

}


/* ----------------------------------
   SUMMARY
---------------------------------- */

function updateSummary(){

    const rows =
        document.querySelectorAll(
            "#studentTableBody tr"
        );


    let passed = 0;

    let failed = 0;

    let completed = 0;


    rows.forEach(
        function(row){

            const result =
                row.querySelector(
                    ".result"
                ).textContent;


            if(result === "PASS"){

                passed++;

                completed++;

            }
            else if(
                result === "FAIL"
            ){

                failed++;

                completed++;

            }

        }
    );


    const total =
        rows.length;


    let passPercentage =
        0;


    if(completed > 0){

        passPercentage =
            (
                passed /
                completed
            ) *
            100;

    }


    document.getElementById(
        "totalStudents"
    ).textContent =
        total;


    document.getElementById(
        "totalPassed"
    ).textContent =
        passed;


    document.getElementById(
        "totalFailed"
    ).textContent =
        failed;


    document.getElementById(
        "passPercentage"
    ).textContent =
        passPercentage.toFixed(2) +
        "%";

}


/* ----------------------------------
   LOAD SAVED RESULTS
---------------------------------- */

async function loadSavedResult(){

    if(!examId){

        return;

    }


    setLoading(
        "पहले से saved marks load हो रहे हैं..."
    );


    const {
        data:resultData,
        error:resultError
    } = await db
        .from("results")
        .select(`
            exam_student_id,
            subject,
            marks
        `)
        .eq(
            "exam_id",
            examId
        );


    if(resultError){

        console.error(
            "Result load error:",
            resultError
        );


        /*
         * अगर result अभी तक save नहीं हुआ
         * तो table खाली रह सकती है।
         */

        resultLoaded = false;

        return;

    }


    const savedResults =
        resultData || [];


    savedResults.forEach(
        function(saved){

            const row =
                document.querySelector(
                    'tr[data-exam-student-id="' +
                    saved.exam_student_id +
                    '"]'
                );


            if(!row){

                return;

            }


            const input =
                row.querySelector(
                    '.marks-input[data-subject="' +
                    CSS.escape(
                        saved.subject
                    ) +
                    '"]'
                );


            if(!input){

                return;

            }


            if(
                saved.marks !== null &&
                saved.marks !== undefined
            ){

                input.value =
                    saved.marks;

            }

        }
    );


    resultLoaded = true;

}


/* ----------------------------------
   SAVE RESULT
---------------------------------- */

async function saveResult(){

    try{

        if(!examId){

            showMessage(
                "Exam ID नहीं मिला।",
                true
            );

            return;

        }


        if(!schoolId){

            showMessage(
                "School ID नहीं मिली।",
                true
            );

            return;

        }


        calculateResults();

        updateSummary();


        const rows =
            document.querySelectorAll(
                "#studentTableBody tr"
            );


        if(rows.length === 0){

            showMessage(
                "Save करने के लिए कोई student नहीं है।",
                true
            );

            return;

        }


        showMessage(
            "Result save हो रहा है..."
        );


        const resultData = [];


        rows.forEach(
            function(row){

                const examStudentId =
                    row.dataset.examStudentId;


                if(!examStudentId){

                    return;

                }


                const inputs =
                    row.querySelectorAll(
                        ".marks-input"
                    );


                inputs.forEach(
                    function(input){

                        if(
                            input.value === ""
                        ){

                            return;

                        }


                        const marks =
                            Number(
                                input.value
                            );


                        if(
                            Number.isNaN(
                                marks
                            )
                        ){

                            return;

                        }


                        resultData.push({

                            exam_id:
                                examId,

                            exam_student_id:
                                examStudentId,

                            subject:
                                input.dataset.subject,

                            marks:
                                marks

                        });

                    }
                );

            }
        );


        if(
            resultData.length === 0
        ){

            showMessage(
                "कोई marks नहीं मिले।",
                true
            );

            return;

        }


        const {
            error
        } = await db
            .from("results")
            .upsert(
                resultData,
                {
                    onConflict:
                        "exam_id,exam_student_id,subject"
                }
            );


        if(error){

            console.error(
                "Save result error:",
                error
            );


            showMessage(
                "Result save नहीं हुआ: " +
                error.message,
                true
            );


            return;

        }


        showMessage(
            "Result successfully save हो गया. ✅"
        );


    }catch(error){

        console.error(error);


        showMessage(
            "Result save करते समय error आया।",
            true
        );

    }

}


/* ----------------------------------
   MESSAGE
---------------------------------- */

function showMessage(
    text,
    isError=false
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    if(isError){

        message.style.color =
            "#dc2626";

    }
    else{

        message.style.color =
            "#15803d";

    }


    setTimeout(
        function(){

            message.textContent =
                "";

        },
        5000
    );

}


/* ----------------------------------
   ERROR
---------------------------------- */

function showError(
    text
){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "tableContainer"
    ).style.display =
        "none";


    document.getElementById(
        "summary"
    ).style.display =
        "none";


    document.getElementById(
        "errorBox"
    ).innerHTML =
        `
        <div class="error">
            ${escapeHtml(text)}
        </div>
        `;

}


/* ----------------------------------
   LOADING
---------------------------------- */

function setLoading(
    text
){

    const loading =
        document.getElementById(
            "loading"
        );


    loading.textContent =
        text;


    loading.style.display =
        "block";

}


/* ----------------------------------
   ESCAPE HTML
---------------------------------- */

function escapeHtml(
    text
){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

/* ----------------------------------
   EXCEL EXPORT
---------------------------------- */

function exportToExcel(){

    calculateResults();


    const rows =
        document.querySelectorAll(
            "#studentTableBody tr"
        );


    if(rows.length === 0){

        alert(
            "Export करने के लिए कोई result नहीं है।"
        );

        return;

    }


    let csv = "";


    csv +=
        "School,Exam,Class,Section,Year\n";


    csv +=
        csvEscape(
            exam.schoolName
        ) +
        "," +
        csvEscape(
            exam.examName
        ) +
        "," +
        csvEscape(
            exam.className
        ) +
        "," +
        csvEscape(
            exam.section
        ) +
        "," +
        csvEscape(
            exam.examYear
        ) +
        "\n\n";


    csv +=
        "Rank,Roll No.,Student Name";


    subjectDetails.forEach(
        function(subject){

            csv +=
                "," +
                csvEscape(
                    subject.subject_name
                );

        }
    );


    csv +=
        ",Total,Percentage,Result\n";


    rows.forEach(
        function(row){

            const cells =
                row.querySelectorAll(
                    "td"
                );


            const values = [];


            values.push(
                cells[0]
                    .textContent
            );


            values.push(
                cells[1]
                    .textContent
            );


            values.push(
                cells[2]
                    .textContent
            );


            const inputs =
                row.querySelectorAll(
                    ".marks-input"
                );


            inputs.forEach(
                function(input){

                    values.push(
                        input.value
                    );

                }
            );


            values.push(
                row.querySelector(
                    ".total"
                ).textContent
            );


            values.push(
                row.querySelector(
                    ".percentage"
                ).textContent
            );


            values.push(
                row.querySelector(
                    ".result"
                ).textContent
            );


            csv +=
                values
                    .map(
                        csvEscape
                    )
                    .join(",") +
                "\n";

        }
    );


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        sanitizeFileName(
            exam.examName +
            "-result.csv"
        );


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* ----------------------------------
   CSV ESCAPE
---------------------------------- */

function csvEscape(
    value
){

    const text =
        String(
            value ?? ""
        );


    if(
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n")
    ){

        return (
            '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"'
        );

    }


    return text;

}


/* ----------------------------------
   FILE NAME
---------------------------------- */

function sanitizeFileName(
    name
){

    return String(name)
        .replace(
            /[\\/:*?"<>|]/g,
            "_"
        );

}
