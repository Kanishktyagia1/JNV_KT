<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | JNV Result Manager</title>

    <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 650px;
        }

        .signup-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        .signup-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .signup-heading h1 {
            color: #2563eb;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .signup-heading p {
            color: #64748b;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .signup-submit {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .signup-submit:hover {
            background: #1d4ed8;
        }

        .signup-note {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 12px;
            border-radius: 6px;
            color: #1e40af;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .signup-links {
            text-align: center;
            margin-top: 22px;
        }

        .signup-links a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .signup-card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="signup-card">

            <div class="signup-heading">
                <h1>Create Admin Account</h1>
                <p>Register your school to manage examination results</p>
            </div>

            <div class="signup-note">
                Admim or School Administrator should create this account.
            </div>

            <form id="signupForm">

                <div class="form-row">

                    <div class="form-group">
                        <label for="schoolName">School Name</label>
                        <input
                            type="text"
                            id="schoolName"
                            placeholder="Enter school name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="teacherName">Admin</label>
                        <input
                            type="text"
                            id="teacherName"
                            placeholder="Enter your name"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="schoolAddress">School Address</label>
                    <input
                        type="text"
                        id="schoolAddress"
                        placeholder="Enter complete school address"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="state">State</label>
                        <input
                            type="text"
                            id="state"
                            placeholder="Enter state"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="district">District</label>
                        <input
                            type="text"
                            id="district"
                            placeholder="Enter district"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="email">Registered Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input
                            type="tel"
                            id="mobile"
                            placeholder="Enter mobile number"
                            pattern="[0-9]{10}"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
    <label for="password">Create Password</label>

    <div style="position: relative;">
        <input
            type="password"
            id="password"
            placeholder="Create password"
            minlength="6"
            required
            style="padding-right: 45px;"
        >

        <button
            type="button"
            id="togglePassword"
            style="
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                border: none;
                background: none;
                cursor: pointer;
                font-size: 18px;
            "
        >👁️</button>
    </div>
                    </div>

                    <div class="form-group">
    <label for="confirmPassword">Confirm Password</label>

    <div style="position: relative;">
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            minlength="6"
            required
            style="padding-right: 45px;"
        >

        <button
            type="button"
            id="toggleConfirmPassword"
            style="
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                border: none;
                background: none;
                cursor: pointer;
                font-size: 18px;
            "
        >👁️</button>
    </div>
                    </div>

                </div>

                <button type="submit" class="signup-submit">
                    Create Account
                </button>

            </form>

            <div class="signup-links">
                Already have an account?
                <a href="login.html">Login here</a>
            </div>

        </div>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

        <script>
const signupForm = document.getElementById("signupForm");

signupForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords match nahi kar rahe.");
        return;
    }

    const schoolName = document.getElementById("schoolName").value.trim();
    const teacherName = document.getElementById("teacherName").value.trim();
    const schoolAddress = document.getElementById("schoolAddress").value.trim();
    const state = document.getElementById("state").value.trim();
    const district = document.getElementById("district").value.trim();
    const email = document.getElementById("email").value.trim();
    const mobile = document.getElementById("mobile").value.trim();

    try {

        // 1. Create Supabase Auth account
        const { data: authData, error: authError } =
            await db.auth.signUp({
                email: email,
                password: password
            });

        if (authError) {
            console.error("Auth signup error:", authError);
            alert("Account create nahi hua.\n\n" + authError.message);
            return;
        }

        if (!authData.user) {
            alert("Auth account create nahi hua.");
            return;
        }

        // 2. Save school information
        const schoolData = {
            school_name: schoolName,
            school_address: schoolAddress,
            state: state,
            district: district,
            admin_name: teacherName,
            email: email,
            mobile: mobile,
            auth_user_id: authData.user.id
        };

        const { data: school, error: schoolError } =
            await db
                .from("schools")
                .insert([schoolData])
                .select()
                .single();

        if (schoolError) {
            console.error("School insert error:", schoolError);

            alert(
                "Auth account ban gaya, lekin school record save nahi hua.\n\n" +
                schoolError.message
            );

            return;
        }

        // 3. Save school ID
        localStorage.setItem("jnv_school_id", school.id);

        alert("Admin account successfully create ho gaya. ✅");

        // 4. Go to login
        window.location.href = "login.html";

    } catch (error) {

        console.error("Signup error:", error);

        alert(
            "Signup mein problem hui.\n\n" +
            error.message
        );
    }
});

              


// Password show/hide
const togglePassword =
    document.getElementById("togglePassword");

const toggleConfirmPassword =
    document.getElementById("toggleConfirmPassword");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");


togglePassword.addEventListener("click", function() {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "🙈";

    } else {

        passwordInput.type = "password";
        togglePassword.textContent = "👁️";

    }
});


toggleConfirmPassword.addEventListener("click", function() {

    if (confirmPasswordInput.type === "password") {

        confirmPasswordInput.type = "text";
        toggleConfirmPassword.textContent = "🙈";

    } else {

        confirmPasswordInput.type = "password";
        toggleConfirmPassword.textContent = "👁️";

    }
});
        </script>

</body>
</html>
