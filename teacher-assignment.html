<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Assignment | JNV Result Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .topbar {
            background: #0d162b;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 {
            margin: 0;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        h1 {
            margin-top: 0;
        }

        h3 {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd3df;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .subject-btn {
            padding: 16px;
            border: 1px solid #d5dbe5;
            background: #f8fafc;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
        }

        .subject-btn:hover {
            background: #eef4ff;
        }

        .subject-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .teacher-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #dce2eb;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .teacher-item input {
            width: 18px;
            height: 18px;
        }

        .teacher-info strong {
            display: block;
        }

        .teacher-info span {
            color: #687386;
            font-size: 14px;
        }

        .assign-btn {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .assign-btn:hover {
            background: #1d4ed8;
        }

        .message {
            color: #687386;
            padding: 10px 0;
        }

        .assignment-item {
            border: 1px solid #dce2eb;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        .assignment-item strong {
            font-size: 17px;
        }

        .delete-btn {
            margin-top: 10px;
            padding: 8px 12px;
            border: none;
            border-radius: 7px;
            background: #ef4444;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 15px;
            }

            .topbar h2 {
                font-size: 18px;
            }

            .back-btn {
                padding: 8px 10px;
                font-size: 13px;
            }

            .container {
                margin: 20px auto;
                padding: 0 14px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <h2>JNV Result Manager</h2>
        <a href="main-dashboard.html" class="back-btn">
            ← Dashboard
        </a>
    </div>

    <div class="container">

        <div class="card">
            <h1>Teacher Assignment</h1>
            <p>Select an exam, then select a subject to assign teachers.</p>

            <label for="examSelect">Select Exam</label>
            <select id="examSelect">
                <option value="">-- Select Exam --</option>
            </select>
        </div>


        <div class="card" id="subjectCard" style="display: none;">
            <h3>Select Subject</h3>

            <div id="subjectList" class="subjects"></div>
        </div>


        <div class="card" id="teacherCard" style="display: none;">
            <h3>
                Select Teacher for
                <span id="selectedSubject"></span>
            </h3>

            <div id="teacherList"></div>

            <button class="assign-btn" id="assignTeachers">
                Assign Selected Teachers
            </button>
        </div>


        <div class="card">
            <h2>Current Assignments</h2>

            <div id="assignmentList">
                <p class="message">No assignments yet.</p>
            </div>
        </div>

    </div>
<script>
alert("HTML IS WORKING");
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="teacher-assignment.js"></script>

<script>
alert("ALL SCRIPTS LOADED");
</script>

</body>
</html>
